# Promtail — ADAPTÉ pour Kubernetes.
#
# La config docker-compose (observability/promtail/promtail-config.yaml)
# utilise `docker_sd_configs` contre /var/run/docker.sock, ce qui n'a pas de
# sens sur un cluster k8s (pas de socket Docker fiable/portable côté node,
# et aucune notion de "docker-compose service label"). Ici on utilise la
# découverte native `kubernetes_sd_configs` (pods du namespace microservices)
# et on lit les logs via les symlinks standard /var/log/containers, ce qui
# fonctionne quel que soit le runtime de conteneurs du node (containerd ou
# docker), y compris sur minikube. Les labels renommés reproduisent
# l'équivalent de "container"/"service" du docker-compose, et le pipeline
# JSON (level/message/trace_id/span_id) est conservé à l'identique.
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: microservices
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: observability
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - json:
              expressions:
                level: level
                message: message
                trace_id: trace_id
                span_id: span_id
          - labels:
              level:
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: microservices
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: microservices
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: observability
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: microservices
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: microservices
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:latest
          imagePullPolicy: Always
          args:
            - "-config.file=/etc/promtail/promtail-config.yaml"
          ports:
            - containerPort: 9080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: positions
              mountPath: /run/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}
        - name: pods-logs
          hostPath:
            path: /var/log/pods
---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: microservices
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: promtail
  ports:
    - name: http
      port: 9080
      targetPort: 9080
