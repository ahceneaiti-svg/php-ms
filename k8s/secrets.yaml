# -----------------------------------------------------------------------------
# SECRETS SQUELETTE — NE JAMAIS COMMITTER DE VRAIES VALEURS ICI.
#
# Les valeurs ci-dessous reprennent les identifiants de DEV du docker-compose.yml
# (app/app, guest/guest) uniquement pour que la stack demo tourne "out of the box"
# sur un minikube local. Pour un usage au-delà d'une démo locale :
#
#   kubectl -n microservices create secret generic postgres-credentials \
#     --from-literal=POSTGRES_USER=app \
#     --from-literal=POSTGRES_PASSWORD=CHANGE_ME \
#     --from-literal=POSTGRES_DB=app \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# ou déléguer à un gestionnaire de secrets externe (Sealed Secrets,
# External Secrets Operator + Vault/SSM, SOPS, etc.) plutôt que d'appliquer
# ce fichier tel quel.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: microservices
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: app
  POSTGRES_MULTIPLE_DATABASES: user_db,client_db
  # URLs prêtes à l'emploi injectées telles quelles dans user-service / client-service
  USER_DATABASE_URL: "postgresql://app:CHANGE_ME@postgres:5432/user_db?serverVersion=16&charset=utf8"
  CLIENT_DATABASE_URL: "postgresql://app:CHANGE_ME@postgres:5432/client_db?serverVersion=16&charset=utf8"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: microservices
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: microservices-demo
type: Opaque
stringData:
  # Symfony APP_SECRET, un par service (voir services/<name>/.env en dev)
  USER_SERVICE_APP_SECRET: CHANGE_ME_user_service_secret
  CLIENT_SERVICE_APP_SECRET: CHANGE_ME_client_service_secret
  NOTIFICATION_SERVICE_APP_SECRET: CHANGE_ME_notification_service_secret
